name: Refresh orbits, receptions, Earth imagery and the MARBLE feed
# Every 6 hours: fetch orbital elements (CelesTrak) and real receptions (SatNOGS, EDEN-signed);
# once: land outlines and Earth imagery. Then wrap every file the globe uses in a MARBLE/1.0
# envelope, chain and seal them, so each visitor's browser can check them before drawing.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Earth-observation orbits (CelesTrak)
        run: |
          curl -fsSL "https://celestrak.org/NORAD/elements/gp.php?GROUP=resource&FORMAT=tle" -o tle.new
          if [ "$(grep -c '^1 ' tle.new)" -gt 10 ]; then mv tle.new tle.txt; else echo "Download looked wrong; keeping old data"; fi
      - name: Land outlines (Natural Earth, once)
        run: |
          [ -s land.geojson ] || curl -fsSL "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_land.geojson" -o land.geojson || echo "Land download failed"
      - name: Real receptions from SatNOGS, signed by EDEN
        env:
          EDEN_SIGNING_SEED: ${{ secrets.EDEN_SIGNING_SEED }}
        run: |
          pip install --quiet cryptography
          python scripts/satnogs_sign.py
          [ -s receptions.json ] && python scripts/satnogs_sign.py --verify || true
      - name: Earth imagery for the photoreal globe (once)
        run: |
          pip install --quiet pillow
          python scripts/fetch_earth.py || echo "Earth imagery step failed; dot-matrix globe stays"
      - name: Seal everything the globe uses in a MARBLE/1.0 feed
        env:
          EDEN_SIGNING_SEED: ${{ secrets.EDEN_SIGNING_SEED }}
        run: |
          python scripts/marble_feed.py
          [ -s globe.marble.json ] && python scripts/marble_feed.py --verify
      - name: Commit if changed
        run: |
          git config user.name "orbit-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A tle.txt land.geojson receptions.json eden_pubkey.txt globe.marble.json tex 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Refresh orbital data" && git push)
